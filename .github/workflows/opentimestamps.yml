# ════════════════════════════════════════════════════════════════════════════
# Horodatage des fichiers du registre dans la blockchain Bitcoin.
#
# Les commits sont déjà datés et signés par GitHub, mais cela suppose de faire
# confiance à GitHub. OpenTimestamps ancre l'empreinte de chaque fichier dans
# Bitcoin : la preuve devient vérifiable par n'importe qui, sans dépendre de ce
# dépôt, de son hébergeur, ni de son auteur.
#
# Deux temps, imposés par le protocole :
#   • « stamp »   : à chaque publication — le calendrier public accuse réception
#                   immédiatement, la preuve est alors « incomplète » ;
#   • « upgrade » : une fois la transaction Bitcoin confirmée (quelques heures),
#                   la preuve se complète et devient autonome. D'où le passage
#                   hebdomadaire qui la consolide.
# ════════════════════════════════════════════════════════════════════════════
name: horodatage

on:
  push:
    branches: [main]
    paths: ['data/**.json']       # les commits de preuves ne se re-déclenchent pas eux-mêmes
  schedule:
    - cron: '23 4 * * 0'          # dimanche 04h23 UTC : consolidation des preuves
  workflow_dispatch: {}

permissions:
  contents: write

# Les publications arrivent en RAFALE : l'API Contents produit un commit par
# fichier, soit une dizaine de poussées en quelques secondes. On sérialise pour ne
# jamais pousser deux commits de preuves concurrents.
#
# Attention — conséquence mesurée le 18/08/2026, qui dicte l'étape ci-dessous :
# même avec cancel-in-progress: false, GitHub ne garde qu'UNE exécution en attente
# par groupe et ANNULE les précédentes. Sur une rafale de douze commits, la plupart
# des runs sont donc annulés. Une étape qui n'horodaterait que les fichiers de SON
# commit laisserait ces fichiers-là sans preuve, définitivement.
concurrency:
  group: horodatage
  cancel-in-progress: false

jobs:
  # Tourne sur publication ET sur déclenchement manuel : l'étape étant devenue
  # auto-réparatrice et idempotente, « Run workflow » est le bouton de rattrapage
  # qui manquait — sans lui, un fichier resté sans preuve devait attendre la
  # publication suivante pour être ancré.
  stamp:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # ref: main — et NON le commit déclencheur (le défaut). L'API Contents
      # publie un fichier par commit : quand la rafale enchaîne plusieurs exécutions,
      # celle qui démarre en dernier doit voir les preuves que la première vient de
      # pousser. Sans ça elle les recalcule, produit un .ots différent sous le MÊME
      # nom, et la publication échoue sur un conflit ajout/ajout — mesuré les 17 et
      # 18/08/2026, et c'est ce qui faisait echouer le dernier commit de chaque rafale.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pip install --quiet opentimestamps-client

      - name: Horodater tout fichier sans preuve
        run: |
          set -euo pipefail
          # On balaie TOUT le registre plutôt que le seul commit déclencheur : c'est
          # ce qui rend l'horodatage auto-réparateur. Un run annulé (cf. la note sur
          # la concurrence) ne perd plus rien — le run suivant rattrape ses fichiers.
          # Le balayage est borné par le nombre de fichiers publiés et ne coûte qu'un
          # sha256 + un test d'existence par fichier ; seuls les manquants sont ancrés.
          manquants=0
          while IFS= read -r f; do
            # La preuve porte l'empreinte du CONTENU dans son nom : une révision
            # ultérieure du même fichier crée une preuve distincte au lieu d'écraser
            # celle de la version précédente — chaque état publié reste vérifiable.
            h=$(sha256sum "$f" | cut -c1-16)
            out="proofs/${f#data/}"
            out="${out%.json}.$h.ots"
            [ -f "$out" ] && continue
            mkdir -p "$(dirname "$out")"
            ots stamp "$f"
            mv "$f.ots" "$out"
            echo "horodate : $out"
            manquants=$((manquants + 1))
          done < <(find data -type f -name '*.json' | sort)
          echo "$manquants fichier(s) nouvellement horodate(s)."

      - name: Publier les preuves
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add proofs || true
          if git diff --cached --quiet; then echo 'Rien a publier.'; exit 0; fi
          git commit -m 'preuves opentimestamps'
          # L'ancrage est deja fait a ce stade : une course de push ne doit pas
          # faire echouer le job. On retente, et on laisse le passage suivant
          # rattraper plutot que de crier — le balayage est auto-reparateur.
          for i in 1 2 3; do
            if git push; then echo "publie (tentative $i)"; exit 0; fi
            echo "push refuse, resynchronisation (tentative $i)"
            git fetch origin main || break
            # -X ours : en cas de collision, la preuve DEJA publiee fait foi.
            # Deux .ots du meme contenu se valent, il n'y a rien a arbitrer.
            git rebase -X ours origin/main || { git rebase --abort || true; break; }
          done
          echo 'Publication des preuves remise au prochain passage.'


  upgrade:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # ref: main — et NON le commit déclencheur (le défaut). L'API Contents
      # publie un fichier par commit : quand la rafale enchaîne plusieurs exécutions,
      # celle qui démarre en dernier doit voir les preuves que la première vient de
      # pousser. Sans ça elle les recalcule, produit un .ots différent sous le MÊME
      # nom, et la publication échoue sur un conflit ajout/ajout — mesuré les 17 et
      # 18/08/2026, et c'est ce qui faisait echouer le dernier commit de chaque rafale.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pip install --quiet opentimestamps-client

      - name: Consolider les preuves confirmees
        # `ots upgrade` sort en erreur quand une preuve est encore en attente :
        # c'est un etat normal, pas un echec du job.
        run: |
          find proofs -name '*.ots' -print0 2>/dev/null \
            | xargs -0 -r -n1 ots upgrade || true

      - name: Publier les preuves consolidees
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # `ots upgrade` laisse un .bak a cote de chaque preuve consolidee.
          find proofs -name '*.ots.bak' -delete 2>/dev/null || true
          git add proofs || true
          if git diff --cached --quiet; then echo 'Rien a publier.'; exit 0; fi
          git commit -m 'preuves opentimestamps (consolidation)'
          # L'ancrage est deja fait a ce stade : une course de push ne doit pas
          # faire echouer le job. On retente, et on laisse le passage suivant
          # rattraper plutot que de crier — le balayage est auto-reparateur.
          for i in 1 2 3; do
            if git push; then echo "publie (tentative $i)"; exit 0; fi
            echo "push refuse, resynchronisation (tentative $i)"
            git fetch origin main || break
            # -X ours : en cas de collision, la preuve DEJA publiee fait foi.
            # Deux .ots du meme contenu se valent, il n'y a rien a arbitrer.
            git rebase -X ours origin/main || { git rebase --abort || true; break; }
          done
          echo 'Publication des preuves remise au prochain passage.'

